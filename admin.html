<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>🖥️ لوحة التحكم</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #e63946;
      --primary-dark: #b71c1c;
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --gold: #ffd700;
      --green: #4caf50;
      --orange: #ff9800;
      --blue: #2196f3;
      --white: #ffffff;
      --gray: #b0b0b0;
      --gray-dark: #666;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-primary);
      color: var(--white);
      min-height: 100vh;
    }
    
    .admin-header {
      background: var(--bg-secondary);
      padding: 15px 20px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .admin-header h1 {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .admin-header h1 i { color: var(--primary); }
    
    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .nav-btn {
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid;
      transition: all 0.2s;
    }
    
    .gold-btn {
      background: rgba(255, 215, 0, 0.15);
      border-color: var(--gold);
      color: var(--gold);
    }
    
    .blue-btn {
      background: rgba(33, 150, 243, 0.15);
      border-color: var(--blue);
      color: var(--blue);
    }
    
    .logout-btn {
      padding: 10px 14px;
      background: rgba(230, 57, 70, 0.15);
      border: 2px solid var(--primary);
      border-radius: 10px;
      color: var(--primary);
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .admin-content {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 100px;
    }
    
    .welcome-box {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
    }
    
    .welcome-box h2 {
      font-size: 20px;
      margin-bottom: 5px;
      color: var(--gold);
    }
    
    .welcome-box p {
      color: var(--gray);
      font-size: 14px;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 18px 12px;
      text-align: center;
      border: 2px solid var(--bg-tertiary);
    }
    
    .stat-card.new { border-color: var(--orange); }
    .stat-card.done { border-color: var(--green); }
    .stat-card.total { border-color: var(--primary); }
    
    .stat-card i { font-size: 26px; margin-bottom: 8px; }
    .stat-card.new i { color: var(--orange); }
    .stat-card.done i { color: var(--green); }
    .stat-card.total i { color: var(--primary); }
    
    .stat-card .stat-number {
      font-size: 28px;
      font-weight: 900;
      font-family: monospace;
      margin-bottom: 3px;
    }
    
    .stat-card .stat-label {
      color: var(--gray);
      font-size: 12px;
      font-weight: 600;
    }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }
    
    .quick-action {
      background: var(--bg-secondary);
      border-radius: 14px;
      padding: 20px 15px;
      text-decoration: none;
      color: var(--white);
      border: 2px solid var(--bg-tertiary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .quick-action i { font-size: 30px; color: var(--primary); }
    .quick-action strong { display: block; font-size: 14px; margin-bottom: 3px; }
    .quick-action span { color: var(--gray); font-size: 11px; }
    
    .section-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-title i { color: var(--primary); }
    
    .orders-container { display: grid; gap: 15px; }
    
    .order-card {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 18px;
      border: 2px solid var(--bg-tertiary);
    }
    
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--bg-tertiary);
    }
    
    .order-id { font-size: 15px; font-weight: 900; color: var(--gold); }
    .order-date { font-size: 11px; color: var(--gray); display: block; margin-top: 3px; }
    
    .order-status {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    
    .order-status.pending { background: rgba(255, 152, 0, 0.15); color: var(--orange); }
    .order-status.delivered { background: rgba(76, 175, 80, 0.15); color: var(--green); }
    
    .order-info { display: grid; gap: 8px; margin-bottom: 15px; }
    
    .order-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--gray);
    }
    
    .order-info-row i { color: var(--primary); width: 18px; font-size: 12px; }
    .order-info-row strong { color: var(--white); }
    
    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg-primary);
      border-radius: 10px;
      margin-bottom: 12px;
    }
    
    .order-total span { color: var(--gray); font-size: 13px; }
    .order-total strong { color: var(--gold); font-size: 18px; font-weight: 900; }
    
    .order-actions { display: flex; gap: 8px; }
    
    .btn-action {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn-view { background: var(--bg-tertiary); color: var(--white); border: 1px solid var(--gray-dark); }
    .btn-delivered { background: linear-gradient(145deg, var(--green), #2e7d32); color: var(--white); }
    .btn-delete { background: rgba(230, 57, 70, 0.15); color: var(--primary); border: 1px solid var(--primary); flex: 0 0 42px; }
    
    .empty-orders {
      text-align: center;
      padding: 80px 20px;
      color: var(--gray);
    }
    
    .empty-orders i { font-size: 70px; color: var(--gray-dark); margin-bottom: 20px; }
    .empty-orders h3 { font-size: 20px; margin-bottom: 10px; }
    
    .loading { text-align: center; padding: 60px 20px; color: var(--gray); }
    .loading i { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
    
    .floating-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 14px 20px;
      background: linear-gradient(145deg, var(--gold), #d4a800);
      color: var(--bg-primary);
      text-decoration: none;
      border-radius: 50px;
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #8b6f00, 0 0 30px rgba(255, 215, 0, 0.5);
      z-index: 999;
    }
    
    .floating-btn i { font-size: 18px; }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }
    
    .modal-overlay.active { display: flex; }
    
    .modal-content {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary);
    }
    
    .modal-header h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
    
    .modal-close {
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 22px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    
    .modal-section { margin-bottom: 20px; }
    .modal-section h4 { font-size: 14px; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    
    .modal-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--bg-tertiary);
      font-size: 13px;
    }
    
    .modal-row span:first-child { color: var(--gray); }
    .modal-row span:last-child { color: var(--white); font-weight: 700; }
    
    .modal-product {
      background: var(--bg-primary);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>
      <i class="fas fa-shield-alt"></i>
      لوحة التحكم
    </h1>
    <div class="header-actions">
      <a href="admin-settings.html" class="nav-btn gold-btn">
        <i class="fas fa-cog"></i>
        الإعدادات
      </a>
      <a href="admin-categories.html" class="nav-btn blue-btn">
        <i class="fas fa-tags"></i>
        الفئات
      </a>
      <button class="logout-btn" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i>
        خروج
      </button>
    </div>
  </header>

  <main class="admin-content">
    
    <div class="welcome-box">
      <h2>👋 مرحباً بك</h2>
      <p>إدارة متجرك بسهولة</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card total">
        <i class="fas fa-box"></i>
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">الكل</div>
      </div>
      <div class="stat-card new">
        <i class="fas fa-clock"></i>
        <div class="stat-number" id="pendingCount">0</div>
        <div class="stat-label">قيد الانتظار</div>
      </div>
      <div class="stat-card done">
        <i class="fas fa-check-circle"></i>
        <div class="stat-number" id="deliveredCount">0</div>
        <div class="stat-label">تم التسليم</div>
      </div>
    </div>
    
    <h2 class="section-title">
      <i class="fas fa-bolt"></i>
      المهام السريعة
    </h2>
    
    <div class="quick-actions">
      <a href="admin-products.html" class="quick-action">
        <i class="fas fa-box-open"></i>
        <div>
          <strong>إدارة المنتجات</strong>
          <span>إضافة/تعديل/حذف</span>
        </div>
      </a>
      <a href="admin-categories.html" class="quick-action">
        <i class="fas fa-tags"></i>
        <div>
          <strong>إدارة الفئات</strong>
          <span>تنظيم المنتجات</span>
        </div>
      </a>
    </div>
    
    <h2 class="section-title">
      <i class="fas fa-list"></i>
      الطلبات
    </h2>
    
    <div id="loadingDiv" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>جاري تحميل الطلبات...</p>
    </div>
    
    <div class="orders-container" id="ordersContainer" style="display: none;"></div>
    
    <div class="empty-orders" id="emptyOrders" style="display: none;">
      <i class="fas fa-inbox"></i>
      <h3>لا توجد طلبات</h3>
      <p>عندما يتم استلام طلب جديد، سيظهر هنا</p>
    </div>
    
  </main>

  <a href="admin-products.html" class="floating-btn">
    <i class="fas fa-box-open"></i>
    المنتجات
  </a>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>
          <i class="fas fa-file-invoice"></i>
          تفاصيل الطلب
        </h3>
        <button class="modal-close" id="modalClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
