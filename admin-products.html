<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>📦 المنتجات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #e63946;
      --primary-dark: #b71c1c;
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --gold: #ffd700;
      --green: #4caf50;
      --white: #ffffff;
      --gray: #b0b0b0;
      --gray-dark: #666;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-primary);
      color: var(--white);
      min-height: 100vh;
    }
    
    .admin-header {
      background: var(--bg-secondary);
      padding: 15px 20px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .admin-header h1 {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .admin-header h1 i { color: var(--primary); }
    
    .back-btn {
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 2px solid var(--gray-dark);
      border-radius: 10px;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .admin-content {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 100px;
    }
    
    .add-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: var(--white);
      border: none;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 0 var(--primary-dark);
      margin-bottom: 25px;
    }
    
    .section-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-title i { color: var(--primary); }
    .section-title span { color: var(--gold); font-family: monospace; }
    
    .products-list { display: grid; gap: 15px; }
    
    .product-item {
      background: var(--bg-secondary);
      border-radius: 14px;
      padding: 15px;
      border: 2px solid var(--bg-tertiary);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .product-item-image {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--gray-dark);
      flex-shrink: 0;
      overflow: hidden;
    }
    
    .product-item-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .product-item-info { flex: 1; min-width: 0; }
    .product-item-name { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
    
    .product-item-meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--gray);
      flex-wrap: wrap;
    }
    
    .product-item-price { color: var(--gold); font-weight: 700; }
    
    .product-item-category {
      background: rgba(230, 57, 70, 0.15);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
    }
    
    .product-item-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .btn-icon {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }
    
    .btn-edit {
      background: rgba(255, 215, 0, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold);
    }
    
    .btn-delete {
      background: rgba(230, 57, 70, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }
    
    .modal-overlay.active { display: flex; }
    
    .modal-content {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 25px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--primary);
    }
    
    .modal-header h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
    
    .modal-close {
      background: transparent;
      border: none;
      color: var(--gray);
      font-size: 22px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    
    .form-group { margin-bottom: 16px; }
    
    .form-group label {
      display: block;
      color: var(--gray);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .form-group label span { color: var(--primary); }
    
    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-primary);
      border: 2px solid var(--bg-tertiary);
      border-radius: 10px;
      color: var(--white);
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    textarea.form-control { resize: vertical; min-height: 70px; }
    select.form-control { cursor: pointer; }
    
    .image-preview {
      width: 100%;
      height: 150px;
      border-radius: 10px;
      background: var(--bg-primary);
      border: 2px dashed var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: var(--gray-dark);
      margin-top: 8px;
      overflow: hidden;
    }
    
    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .save-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(145deg, var(--green), #2e7d32);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 0 #1b5e20;
      margin-top: 10px;
    }
    
    .save-btn:disabled { opacity: 0.6; }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }
    
    .empty-state i { font-size: 60px; color: var(--gray-dark); margin-bottom: 15px; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; }
    
    .loading { text-align: center; padding: 40px 20px; color: var(--gray); }
    .loading i { font-size: 36px; color: var(--primary); margin-bottom: 10px; }
    
    .floating-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 14px 20px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: var(--white);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 var(--primary-dark);
      z-index: 999;
    }
    
    .floating-btn i { font-size: 18px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>
      <i class="fas fa-box-open"></i>
      إدارة المنتجات
    </h1>
    <a href="admin.html" class="back-btn">
      <i class="fas fa-arrow-right"></i> رجوع
    </a>
  </header>

  <main class="admin-content">
    
    <button class="add-btn" id="addProductBtn">
      <i class="fas fa-plus-circle"></i>
      إضافة منتج جديد
    </button>
    
    <h2 class="section-title">
      <i class="fas fa-list"></i>
      المنتجات (<span id="productsCount">0</span>)
    </h2>
    
    <div id="loadingDiv" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>جاري التحميل...</p>
    </div>
    
    <div class="products-list" id="productsList" style="display: none;"></div>
    
    <div class="empty-state" id="emptyState" style="display: none;">
      <i class="fas fa-box-open"></i>
      <h3>لا توجد منتجات</h3>
      <p>أضف منتجك الأول</p>
    </div>
    
  </main>

  <a href="admin.html" class="floating-btn">
    <i class="fas fa-list"></i> الطلبات
  </a>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">
          <i class="fas fa-plus-circle"></i>
          إضافة منتج
        </h3>
        <button class="modal-close" id="modalClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="form-group">
        <label>اسم المنتج <span>*</span></label>
        <input type="text" id="productName" class="form-control" placeholder="مثال: مسجل سيارة">
      </div>
      
      <div class="form-group">
        <label>السعر (دج) <span>*</span></label>
        <input type="number" id="productPrice" class="form-control" placeholder="مثال: 8000">
      </div>
      
      <div class="form-group">
        <label>الفئة <span>*</span></label>
        <select id="productCategory" class="form-control">
          <option value="">-- اختر الفئة --</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>الوصف (اختياري)</label>
        <textarea id="productDescription" class="form-control" placeholder="وصف قصير"></textarea>
      </div>
      
      <div class="form-group">
        <label>رابط الصورة (اختياري)</label>
        <input type="url" id="productImage" class="form-control" placeholder="https://i.imgur.com/xxxx.jpg" oninput="window.updatePreview()">
        <div class="image-preview" id="imagePreview">
          <i class="fas fa-image"></i>
        </div>
        <p style="color:#666; font-size:11px; margin-top:6px;">
          💡 ارفع صورة على Imgur والصق الرابط
        </p>
      </div>
      
      <button class="save-btn" id="saveProductBtn">
        <i class="fas fa-save"></i>
        حفظ المنتج
      </button>
    </div>
  </div>

  <script type="module" src="admin-products.js"></script>
</body>
</html>
