<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>⚙️ الإعدادات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #e63946;
      --primary-dark: #b71c1c;
      --bg-primary: #0a0a0a;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --gold: #ffd700;
      --green: #4caf50;
      --white: #ffffff;
      --gray: #b0b0b0;
      --gray-dark: #666;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-primary);
      color: var(--white);
      min-height: 100vh;
    }
    
    .admin-header {
      background: var(--bg-secondary);
      padding: 15px 20px;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .admin-header h1 {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .admin-header h1 i { color: var(--primary); }
    
    .back-btn {
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 2px solid var(--gray-dark);
      border-radius: 10px;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .admin-content {
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
      padding-bottom: 100px;
    }
    
    .page-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .page-title i { color: var(--primary); }
    
    .settings-card {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      border: 2px solid var(--bg-tertiary);
    }
    
    .settings-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--bg-tertiary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .settings-card h3 i { color: var(--primary); }
    
    .form-group { margin-bottom: 18px; }
    
    .form-group label {
      display: block;
      color: var(--gray);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .form-group label span { color: var(--primary); }
    
    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-primary);
      border: 2px solid var(--bg-tertiary);
      border-radius: 10px;
      color: var(--white);
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      transition: all 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .form-control::placeholder { color: var(--gray-dark); }
    
    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }
    
    .form-help {
      display: block;
      color: var(--gray-dark);
      font-size: 12px;
      margin-top: 6px;
    }
    
    .color-input-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .color-picker {
      width: 60px;
      height: 60px;
      border: 3px solid var(--bg-tertiary);
      border-radius: 12px;
      cursor: pointer;
      padding: 0;
      background: none;
    }
    
    .color-value {
      flex: 1;
      font-family: monospace;
      font-size: 15px;
    }
    
    .logo-preview {
      width: 100%;
      height: 150px;
      border-radius: 12px;
      background: var(--bg-primary);
      border: 2px dashed var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: var(--gray-dark);
      margin-top: 10px;
      overflow: hidden;
    }
    
    .logo-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    
    .save-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(145deg, var(--green), #2e7d32);
      color: var(--white);
      border: none;
      border-radius: 12px;
      font-family: 'Cairo', sans-serif;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 0 #1b5e20;
      transition: all 0.2s;
      margin-top: 15px;
    }
    
    .save-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1b5e20; }
    .save-btn:disabled { opacity: 0.6; }
    
    .save-status {
      display: none;
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      margin-top: 15px;
    }
    
    .save-status.success {
      display: block;
      background: rgba(76, 175, 80, 0.15);
      border: 2px solid var(--green);
      color: var(--green);
    }
    
    .save-status.error {
      display: block;
      background: rgba(230, 57, 70, 0.15);
      border: 2px solid var(--primary);
      color: var(--primary);
    }
    
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
    }
    
    .loading i { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
    
    .floating-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      padding: 14px 20px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: var(--white);
      text-decoration: none;
      border-radius: 50px;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 var(--primary-dark);
      z-index: 999;
    }
    
    .floating-btn i { font-size: 18px; }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>
      <i class="fas fa-cog"></i>
      إعدادات المتجر
    </h1>
    <a href="admin.html" class="back-btn">
      <i class="fas fa-arrow-right"></i> رجوع
    </a>
  </header>

  <main class="admin-content">
    
    <h1 class="page-title">
      <i class="fas fa-sliders-h"></i>
      تخصيص المتجر
    </h1>
    
    <div id="loadingDiv" class="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>جاري التحميل...</p>
    </div>
    
    <div id="settingsContent" style="display: none;">
      
      <!-- المعلومات -->
      <div class="settings-card">
        <h3><i class="fas fa-info-circle"></i> المعلومات الأساسية</h3>
        
        <div class="form-group">
          <label>اسم المتجر <span>*</span></label>
          <input type="text" id="storeName" class="form-control" placeholder="مثال: متجري">
        </div>
        
        <div class="form-group">
          <label>وصف المتجر</label>
          <textarea id="storeDescription" class="form-control" placeholder="وصف قصير"></textarea>
        </div>
        
        <div class="form-group">
          <label>رقم واتساب <span>*</span></label>
          <input type="tel" id="whatsappNumber" class="form-control" placeholder="0500000000">
          <span class="form-help">💡 الرقم الذي سيظهر للعملاء</span>
        </div>
      </div>
      
      <!-- الشعار -->
      <div class="settings-card">
        <h3><i class="fas fa-image"></i> الشعار</h3>
        
        <div class="form-group">
          <label>رابط الشعار</label>
          <input type="url" id="logoUrl" class="form-control" placeholder="https://i.imgur.com/xxxxx.png" oninput="window.updateLogoPreview()">
          <span class="form-help">💡 ارفع الشعار على Imgur والصق الرابط</span>
        </div>
        
        <div class="logo-preview" id="logoPreview">
          <i class="fas fa-store"></i>
        </div>
      </div>
      
      <!-- الألوان -->
      <div class="settings-card">
        <h3><i class="fas fa-palette"></i> الألوان</h3>
        
        <div class="form-group">
          <label>اللون الأساسي</label>
          <div class="color-input-group">
            <input type="color" id="primaryColor" class="color-picker" value="#e63946" oninput="window.updatePrimaryColor()">
            <input type="text" id="primaryColorText" class="form-control color-value" value="#e63946" oninput="window.updatePrimaryColorText()">
          </div>
        </div>
        
        <div class="form-group">
          <label>لون الخلفية</label>
          <div class="color-input-group">
            <input type="color" id="secondaryColor" class="color-picker" value="#0a0a0a" oninput="window.updateSecondaryColor()">
            <input type="text" id="secondaryColorText" class="form-control color-value" value="#0a0a0a" oninput="window.updateSecondaryColorText()">
          </div>
        </div>
      </div>
      
      <button class="save-btn" id="saveBtn">
        <i class="fas fa-save"></i>
        حفظ الإعدادات
      </button>
      
      <div class="save-status" id="saveStatus"></div>
      
    </div>
    
  </main>

  <a href="admin.html" class="floating-btn">
    <i class="fas fa-list"></i> الطلبات
  </a>

  <script type="module" src="admin-settings.js"></script>
</body>
</html>
